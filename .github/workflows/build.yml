name: Build and Release APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          S1: ${{ secrets.KEYSTORE_BASE64 }}
          S2: ${{ secrets.KEYSTORE_PASSWORD }}
          S3: ${{ secrets.KEY_ALIAS }}
          S4: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -n "$S1" ] || { echo "::error::Secret missing: KEYSTORE_BASE64"; exit 1; }
          [ -n "$S2" ] || { echo "::error::Secret missing: KEYSTORE_PASSWORD"; exit 1; }
          [ -n "$S3" ] || { echo "::error::Secret missing: KEY_ALIAS"; exit 1; }
          [ -n "$S4" ] || { echo "::error::Secret missing: KEY_PASSWORD"; exit 1; }
          echo "All 4 signing secrets found"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/enova.jks"

      - name: Build APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/enova.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Show signing certificate
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Enova-Launcher.apk
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)apksigner
          "$AS" verify --print-certs Enova-Launcher.apk | head -5 || true

      - name: Read version
        id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: enova-launcher-apk
          path: Enova-Launcher.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: Enova Launcher v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: Enova-Launcher.apk
