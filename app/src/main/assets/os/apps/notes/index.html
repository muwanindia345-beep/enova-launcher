<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes</title>
<style>
/* Starter app 1: Notes. Seekho: textarea + localStorage */
body{margin:0;padding:14px;background:#020a04;color:#b9f5c8;font-family:monospace}
textarea{width:100%;height:60vh;background:#04120a;color:#b9f5c8;border:1px solid #0f2a17;border-radius:8px;padding:10px;font:inherit;box-sizing:border-box;outline:0}
button{margin-top:10px;background:#00ff41;color:#001a07;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:700}
</style></head><body>
<textarea id="ta" placeholder="Kuch likho..."></textarea>
<button id="sv">Save</button> <span id="ok"></span>
<script>
const ta=document.getElementById('ta');
try{ta.value=localStorage.getItem('eos-note')||''}catch(e){}
document.getElementById('sv').onclick=()=>{
  try{localStorage.setItem('eos-note',ta.value);document.getElementById('ok').textContent='saved ✅'}catch(e){}
};
</script></body></html>
